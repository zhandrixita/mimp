<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta http-equiv="refresh" content="0; url=./pagina/index_v2.html">

    <script>
        window.location.replace("./pagina/index_v2.html");
    </script>

    <title>Dashboard MIMP</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .contenedor {
            width: 90%;
            max-width: 600px;
            padding: 40px;
            text-align: center;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 30px;
            color: #555;
        }

        .enlaces {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .boton {
            min-width: 180px;
            padding: 14px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            color: white;
            background: #7b1e48;
            transition: transform 0.2s, opacity 0.2s;
        }

        .boton:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

    </style>
</head>

<body>

    <main class="contenedor">

        <h1>Dashboard MIMP</h1>

        <p>Acceda al tablero de casos atendidos por los Centros Emergencia Mujer y Familia.</p>

        <div class="enlaces">

            <a
                class="boton"
                href="./pagina/index_v2.html"
            >
                Abrir dashboard
            </a>

        </div>

    </main>

</body>
</html>
